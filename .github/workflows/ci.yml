name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    # Canonical pipeline lives in rickarm/ci-shared (lint + compile smoke + tests).
    # Change CI behaviour there, not here.
    uses: rickarm/ci-shared/.github/workflows/python-ci.yml@main
    with:
      # Test deps (pytest-asyncio, …) live in the [test] extra, not the default group.
      all-extras: true
      # config.Settings requires things_agent_api_key at import time; the suite mocks
      # all external calls, so this is a throwaway value, not a real secret.
      test-env: |
        THINGS_AGENT_API_KEY=ci-test-key
