name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test --frozen

      - name: Run tests
        env:
          # Required field in config.py; the suite mocks all external calls,
          # so this is a throwaway value, not a real secret.
          THINGS_AGENT_API_KEY: ci-test-key
        run: uv run --extra test python -m pytest -q
